mcp_servers:
  graphiti:
    enabled: true
    url: http://127.0.0.1:8765/mcp/
  mempalace:
    command: /var/home/rainbow/.hermes/scripts/mempalace-mcp.sh
    enabled: false
  qmd:
    args:
    - mcp
    command: /var/home/rainbow/.hermes/scripts/qmd-local.sh
    enabled: false
  stealth-browser-mcp:
    command: /var/home/rainbow/.hermes/mcp/stealth-browser-mcp/.venv/bin/python
    args:
    - /var/home/rainbow/.hermes/mcp/stealth-browser-mcp/src/server.py
    workdir: /var/home/rainbow/.hermes/mcp/stealth-browser-mcp/src
    enabled: true
    defer_loading: true
  scrapfly:
    url: https://mcp.scrapfly.io/mcp
    enabled: false
session_reset:
  mode: none
platform_toolsets:
  cli:
  - browser
  - clarify
  - code_execution
  - computer_use
  - cronjob
  - delegation
  - file
  - memory
  - session_search
  - skills
  - terminal
  - todo
  - vision
  - web
harness_fingerprint:
  enabled: true
  hash_inputs:
  - tools
  - skills
  - compaction_policy
  - approval_mode
  - timeout
persona_execution_split:
  enabled: true
information_flow_control:
  enabled: false
  labels:
  - public
  - session
  - private
  default_tool_result_label: session
critique_bank:
  enabled: true
  path: cache/critique-bank.jsonl
  max_critiques_per_injection: 3
  source_model: cheap-family
nl_permission_policies:
  enabled: false
  policy_dir: ~/.hermes/policies
ledger_orchestration:
  enabled: false
  ledger_file: cache/session-ledger.jsonl
tool_slo:
  enabled: true
  schema_valid_min: 0.95
  retries_without_progress_max: 3
  same_args_retry_max: 2
  emit_metrics: true
durable_file_write_gate:
  enabled: true
  guarded_paths:
  - ~/.hermes/memory.md
  - ~/.hermes/skills/
  - AGENTS.md
  - .hermes/
skill_wiki:
  enabled: true
  dir: cache/skill-wiki
  upsert_on_skill_update: true
  export_on_weekly_review: true
skill_state:
  enabled: true
  dir: cache/skill-state
  obs_ring_buffer: 3
  gc_after_hours: 24
  activate_threshold_steps: 10
tool_auth:
  enabled: true
  log_dir: cache/tool-auth-log
  action_induction_patterns: true
  external_tier_high_risk_warn: true
  governance_primitives:
    discovery: true
    identity: true
    attestation: log
    supply_chain: log
calibration_gate:
  enabled: true
  warn_on_authoritative_display: true
  commitment_threshold: 0.3
loop_harness:
  enabled: true
  risk_floor_path: cache/loop-harness/risk-floor.json
  irreversible_action_cap: 5
  decay_disabled: true
observer_skip_list:
  enabled: true
  skip_tool_bodies:
  - read_file
  - search_files
  - web_extract
  - browser_snapshot
  max_tail_messages: 5
  log_body_char_count: true
persona_isolation:
  enabled: true
  persona_in_system_prompt_only: true
  strip_persona_from_tool_context: false
first_chunk_rank:
  enabled: true
  apply_to_tools:
  - web_extract
  - read_file
  - terminal
  threshold_chars: 8000
  top_chunks: 3
  chunk_size_chars: 2000
constraint_freshness:
  enabled: true
  max_constraint_age_days: 90
  warn_on_stale_constraint: true
  require_freshness_on_promote: true
handoff:
  prefer_structured_wm: true
  lint_constraints: true
  full_trajectory_on_model_switch: false
