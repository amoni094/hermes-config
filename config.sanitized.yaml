model:
  context_length: 200000
  default: claude-sonnet-4-6
  provider: anthropic
providers:
  anthropic:
    stale_timeout_seconds: 900
fallback_providers:
- provider: xai
  model: grok-4.6
- provider: mistral
  model: mistral-large-latest
  base_url: https://api.mistral.ai/v1
- provider: sambanova
  model: gemma-4-31B-it
  base_url: https://api.sambanova.ai/v1
toolsets:
- hermes-cli
agent:
  max_turns: 500
  gateway_timeout: 1800
  api_max_retries: 5
  tool_use_enforcement: strict
  task_completion_guidance: false
  environment_probe: false
  verify_on_stop: auto
  session_stall_timeout: 1800
terminal:
  backend: local
  timeout: 180
web:
  search_backend: brave-free
  extract_backend: firecrawl
browser:
  args: --no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage
  executable_path: /var/home/rainbow/.cache/ms-playwright/chromium-1223/chrome-linux64/chrome
file_read_max_chars: 200000
mcp_discovery_timeout: 30
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
    no_effective_progress: 5
    delegation_event_budget: 50
  tool_result_cache:
    enabled: true
    scope: session
    max_entries: 200
    excluded_tools:
    - terminal
    - browser_navigate
    - browser_click
    - browser_type
    - computer_use
    - cronjob
    - delegate_task
    - process
    - write_file
    - patch
compression:
  enabled: true
  threshold: 0.35
  threshold_tokens: ''
  protect_last_n: 32
  min_tail_user_messages: 3
  proactive_prune_tokens: ''
  micro_compact: true
  micro_compact_every_n_turns: 4
  idle_compact_after_seconds: 1800
  intent_conditioned_offload: true
prompt_caching:
  cache_ttl: 1h
auxiliary:
  vision:
    provider: anthropic
    model: claude-haiku-4-5
  compression:
    provider: anthropic
    model: claude-haiku-4-5
    fallback_chain:
    - provider: anthropic
      model: claude-haiku-4-5
    - provider: sambanova
      model: gemma-4-31B-it
      base_url: https://api.sambanova.ai/v1
    max_concurrency: 2
    max_tokens: 4096
  title_generation:
    provider: mistral
    model: mistral-small-latest
    base_url: https://api.mistral.ai/v1
  triage_specifier:
    provider: mistral
    model: mistral-small-latest
    base_url: https://api.mistral.ai/v1
  curator:
    provider: mistral
    model: mistral-small-latest
    base_url: https://api.mistral.ai/v1
  web_extract:
    provider: mistral
    model: mistral-small-latest
    base_url: https://api.mistral.ai/v1
display:
  resume_display: compact
  resume_exchanges: 3
  show_cost: true
  tool_progress: all
memory:
  memory_char_limit: 2200
  user_char_limit: 1600
  provider: hindsight
  tier_thresholds:
    min_score_stage: 2
    min_retention_promote: 0.45
    promote_thresholds:
      ephemeral: 0.55
      volatile: 0.3
      stable: 0.45
    ttl_days_volatile: 30
    ttl_days_stable: 365
    max_ephemeral_facts: 500
    max_volatile_sessions: 20
    graphiti_warn_nodes: 40000
    graphiti_halt_nodes: 50000
  rdm:
    ephemeral: 0.4
    volatile: 0.75
    stable: 1.0
    rdm_lambda: 0.05
  size_caps:
    max_fact_bytes: 16384
    max_tool_excerpt_bytes: 2048
  retry_budgets:
    transient:
      max_attempts: 5
      base_delay: 2.0
      backoff: 2.0
    resource:
      max_attempts: 2
      base_delay: 30.0
      backoff: 1.0
    semantic:
      max_attempts: 2
      base_delay: 1.0
      backoff: 1.0
    auth:
      max_attempts: 1
      base_delay: 5.0
      backoff: 1.0
    fatal:
      max_attempts: 0
      base_delay: 0.0
      backoff: 1.0
  working_memory:
    enabled: true
    dir: cache/working-memory
    skill_selection_from_wm: true
    constraint_binding_required: true
delegation:
  model: grok-4.6
  provider: xai
  child_timeout_seconds: 0
  max_concurrent_children: 10
  max_spawn_depth: 1
  default_toolset_policy: minimal
  toolset_escalation: true
  toolset_profiles:
    research:
      enabled_toolsets:
      - web
      - file
      escalation_toolsets:
      - web
      - file
      - memory
      - session_search
    code:
      enabled_toolsets:
      - terminal
      - file
      escalation_toolsets:
      - terminal
      - file
      - delegation
    write:
      enabled_toolsets:
      - file
      escalation_toolsets:
      - file
      - web
    cross_domain:
      enabled_toolsets:
      - web
      - terminal
      - file
      escalation_toolsets:
      - web
      - terminal
      - file
      - memory
      - session_search
      - delegation
  hierarchy_aware: true
moa:
  default_preset: default
  presets:
    default:
      reference_models:
      - model: claude-haiku-4-5
        provider: anthropic
      aggregator:
        provider: anthropic
        model: claude-sonnet-4-6
      enabled: false
      reference_max_tokens: ''
