name: validate-export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-export.yml'
      - '.gitignore'
      - 'README.md'
      - 'config.sanitized.yaml'
      - 'cron.snapshot.json'
      - 'docs/current-workflow.md'
      - 'scripts/*.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-export.yml'
      - '.gitignore'
      - 'README.md'
      - 'config.sanitized.yaml'
      - 'cron.snapshot.json'
      - 'docs/current-workflow.md'
      - 'scripts/*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-export-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Compile repo scripts
        run: python -m compileall scripts

      - name: Validate sanitized export
        run: python scripts/validate_repo.py
