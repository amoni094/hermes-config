model:
  provider: anthropic
  default: claude-sonnet-4-6
  context_length: 128000
toolsets:
- hermes-cli
agent:
  max_turns: 150
  gateway_timeout: 1800
  tool_use_enforcement: permissive
  task_completion_guidance: false
  environment_probe: false
  verify_on_stop: false
terminal:
  backend: local
  timeout: 180
compression:
  enabled: true
  threshold: 0.5
auxiliary:
  compression:
    provider: anthropic
    model: claude-haiku-4-5
display:
  resume_display: compact
  resume_exchanges: 3
  tool_progress: all
memory:
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: hindsight
approvals:
  destructive_slash_confirm: false
command_allowlist: '["stop/restart system service", "hermes update"]'
onboarding:
  seen:
    openclaw_residue_cleanup: true
    tool_progress_prompt: true
_config_version: 33
plugins:
  enabled:
  - orca-status
session_reset:
  mode: none
mcp_servers:
  mempalace:
    command: /var/home/rainbow/.hermes/scripts/mempalace-mcp.sh
    enabled: false
  qmd:
    command: /var/home/rainbow/.hermes/scripts/qmd-local.sh
    args:
    - mcp
    enabled: true
  graphiti:
    url: http://127.0.0.1:8765/mcp/
    enabled: true
fallback_model:
- provider: cerebras
  model: gpt-oss-120b
- provider: sambanova
  model: DeepSeek-V3.1
- provider: mistral
  model: mistral-large-latest
delegation:
  model: claude-opus-4-8
  provider: anthropic
  max_spawn_depth: 1
  max_concurrent_children: 3
