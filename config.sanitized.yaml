    max_tokens: 4096
  title_generation:
    provider: mistral
    model: mistral-small-latest
    base_url: https://api.mistral.ai/v1
  triage_specifier:
    provider: mistral
    model: mistral-small-latest
    base_url: https://api.mistral.ai/v1
  curator:
    provider: mistral
    model: mistral-small-latest
    base_url: https://api.mistral.ai/v1
  web_extract:
    provider: mistral
    model: mistral-small-latest
    base_url: https://api.mistral.ai/v1
display:
  resume_display: compact
  resume_exchanges: 3
  show_cost: true
  tool_progress: all
memory:
  memory_char_limit: 2200
  user_char_limit: 1600
  provider: hindsight
  tier_thresholds:
    min_score_stage: 2
    min_retention_promote: 0.45
    promote_thresholds:
      ephemeral: 0.55
      volatile: 0.3
      stable: 0.45
    ttl_days_volatile: 30
    ttl_days_stable: 365
    max_ephemeral_facts: 500
    max_volatile_sessions: 20
    graphiti_warn_nodes: 40000
    graphiti_halt_nodes: 50000
  rdm:
    ephemeral: 0.4
    volatile: 0.75
    stable: 1.0
    rdm_lambda: 0.05
  size_caps:
    max_fact_bytes: 16384
    max_tool_excerpt_bytes: 2048
  retry_budgets:
    transient:
      max_attempts: 5
      base_delay: 2.0
      backoff: 2.0
    resource:
      max_attempts: 2
      base_delay: 30.0
      backoff: 1.0
    semantic:
      max_attempts: 2
      base_delay: 1.0
      backoff: 1.0
    auth:
      max_attempts: 1
      base_delay: 5.0
      backoff: 1.0
    fatal:
      max_attempts: 0
      base_delay: 0.0
      backoff: 1.0
  working_memory:
    enabled: true
    dir: cache/working-memory
    skill_selection_from_wm: true
    constraint_binding_required: true
delegation:
  model: grok-4.6
  provider: xai
  child_timeout_seconds: 900
  max_concurrent_children: 10
  max_spawn_depth: 1
  default_toolset_policy: minimal
