  proactive_prune_min_reclaim_tokens: ''
  micro_compact: true
  micro_compact_every_n_turns: 3
  micro_compact_defrag_threshold_tokens: ''
  idle_compact_after_seconds: 1800
  intent_conditioned_offload: true
  use_rr_scorer: true
  rr_scorer_lambda: 0.2
prompt_caching:
  cache_ttl: 1h
auxiliary:
  vision:
    provider: anthropic
    model: claude-haiku-4-5
  compression:
    provider: anthropic
    model: claude-haiku-4-5
    fallback_chain:
    - provider: anthropic
      model: claude-haiku-4-5
    - provider: sambanova
      model: gemma-4-31B-it
      base_url: https://api.sambanova.ai/v1
