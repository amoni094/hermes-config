model:
  provider: anthropic
  default: claude-sonnet-5
  context_length: 200000
custom_providers:
- name: openai
  base_url: https://api.openai.com/v1
  key_env: OPENAI_API_KEY
  api_mode: chat_completions
  context_length: 128000
  max_output_tokens: 16384
  models:
    gpt-5.4:
      context_length: 1050000
    gpt-5.5:
      context_length: 1050000
toolsets:
- hermes-cli
agent:
  max_turns: 150
  gateway_timeout: 1800
  tool_use_enforcement: permissive
  task_completion_guidance: false
  environment_probe: false
  verify_on_stop: false
terminal:
  backend: local
  timeout: 180
compression:
  enabled: true
  threshold: 0.4
display:
  resume_display: compact
  resume_exchanges: 3
  tool_progress: all
memory:
  memory_char_limit: 2200
  user_char_limit: 1600
  provider: hindsight
approvals:
  destructive_slash_confirm: false
command_allowlist: '["stop/restart system service", "hermes update"]'
onboarding:
  seen:
    openclaw_residue_cleanup: true
    tool_progress_prompt: true
    busy_input_prompt: true
_config_version: 33
plugins:
  enabled:
  - orca-status
session_reset:
  mode: none
mcp_servers:
  mempalace:
    command: /var/home/rainbow/.hermes/scripts/mempalace-mcp.sh
    enabled: false
  qmd:
    command: /var/home/rainbow/.hermes/scripts/qmd-local.sh
    args:
    - mcp
    enabled: true
  graphiti:
    url: http://127.0.0.1:8765/mcp/
    enabled: true
fallback_model:
- provider: cerebras
  model: gpt-oss-120b
  base_url: https://api.cerebras.ai/v1
- provider: sambanova
  model: DeepSeek-V3.2
  base_url: https://api.sambanova.ai/v1
- provider: mistral
  model: mistral-large-latest
  base_url: https://api.mistral.ai/v1
delegation:
  model: claude-sonnet-5
  provider: anthropic
  max_spawn_depth: 1
  max_concurrent_children: 3
